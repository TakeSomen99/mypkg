name: ros2-build-and-test

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ryuichiueda/ubuntu22.04-ros2:latest

    steps:
      # --------------------------------------------------
      # 1. mypkg を checkout
      # --------------------------------------------------
      - name: Checkout mypkg
        uses: actions/checkout@v4
        with:
          path: ros2_ws/src/mypkg

      # --------------------------------------------------
      # 2. device_msgs を clone（外部依存）
      # --------------------------------------------------
      - name: Clone device_msgs
        run: |
          mkdir -p ros2_ws/src
          cd ros2_ws/src
          git clone https://github.com/TakeSomen99/device_msgs.git

      # --------------------------------------------------
      # 3. ROS 2 environment
      # --------------------------------------------------
      - name: Source ROS 2
        run: |
          source /opt/ros/jazzy/setup.bash
          echo "ROS_DISTRO=$ROS_DISTRO"

      # --------------------------------------------------
      # 4. Install build tools
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            python3-colcon-common-extensions \
            python3-rosdep

      # --------------------------------------------------
      # 5. Build workspace
      # --------------------------------------------------
      - name: Build workspace
        shell: bash
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --cmake-args -DBUILD_TESTING=OFF

      # --------------------------------------------------
      # 6. Run integration test (launch + service test)
      # --------------------------------------------------
      - name: Run test.bash
        shell: bash
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash
          chmod +x src/mypkg/test/test.bash
          src/mypkg/test/test.bash
